/**
 * Universal RPC API Caller with GAS Bridge & Local Mock Fallback
 */
function gas(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      if (typeof google.script.run[fn] === 'function') {
        args.push(getSessionToken_());
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)[fn].apply(null, args);
      } else {
        reject(new Error('Function ' + fn + ' not found in Apps Script backend.'));
      }
    } else {
      setTimeout(function() {
        try {
          var res = getMockResponse_(fn, args);
          resolve(res);
        } catch (e) {
          reject(e);
        }
      }, 350);
    }
  });
}

function getSessionToken_() {
  try {
    return window.sessionStorage.getItem('aaphreml-session-token') || '';
  } catch (e) {
    return '';
  }
}

function saveSessionToken_(token) {
  try {
    window.sessionStorage.setItem('aaphreml-session-token', token);
  } catch (e) {
    throw new Error('This browser cannot securely store the login session.');
  }
}

function clearSessionToken_() {
  try {
    window.sessionStorage.removeItem('aaphreml-session-token');
  } catch (e) {
    // The server-side session is revoked even if browser storage is unavailable.
  }
}

function errMsg(e) {
  return (e && e.message ? e.message : String(e || 'Something went wrong')).replace(/^Error:\s*/, '');
}

function callBackend(funcName, args, callback, errorCallback) {
  showLoader(true);

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    var runner = google.script.run
      .withSuccessHandler(function(response) {
        showLoader(false);
        if (response && response.success === false) {
          showToast(response.error || 'Server error', 'danger');
          if (errorCallback) errorCallback(response.error);
        } else {
          var payload = (response && response.data !== undefined) ? response.data : response;
          if (callback) callback(payload);
        }
      })
      .withFailureHandler(function(err) {
        showLoader(false);
        showToast(err.message || 'Execution failed', 'danger');
        if (errorCallback) errorCallback(err);
      });

    // Invoke dynamic function name
    if (typeof runner[funcName] === 'function') {
      var requestArgs = (args || []).slice();
      requestArgs.push(getSessionToken_());
      runner[funcName].apply(runner, requestArgs);
    } else {
      showLoader(false);
      showToast('API endpoint not found: ' + funcName, 'danger');
    }
  } else {
    // Standalone Browser Preview Mode Fallback
    console.warn('Running outside GAS container. Simulating endpoint: ' + funcName);
    setTimeout(function() {
      showLoader(false);
      var mock = getMockResponse_(funcName, args);
      if (callback) callback(mock);
    }, 250);
  }
}

/**
 * Shows / hides full-screen loading spinner
 */
function showLoader(visible) {
  var el = document.getElementById('global-loader');
  if (el) el.style.display = visible ? 'flex' : 'none';
}

/**
 * Dispatches toast notification alerts
 */
function showToast(message, type) {
  var container = document.getElementById('toast-container');
  if (!container) return;

  var toast = document.createElement('div');
  toast.className = 'toast toast-' + (type || 'info');
  var icon = type === 'success' ? 'fa-check-circle' : type === 'danger' ? 'fa-exclamation-circle' : 'fa-info-circle';
  toast.innerHTML = '<i class="fas ' + icon + '"></i><span>' + message + '</span>';

  container.appendChild(toast);
  setTimeout(function() {
    toast.style.opacity = '0';
    setTimeout(function() { toast.remove(); }, 300);
  }, 4000);
}

/**
 * Core Hash Router
 */
function navigateTo(viewName, param) {
  // Protocol submission is strictly exclusive to Investigator and System Administrator
  if (viewName === 'submission') {
    var curRole = AppState.currentUser ? AppState.currentUser.role : '';
    if (curRole !== 'Investigator' && curRole !== 'System Administrator') {
      showToast('Protocol submission is exclusive to Principal Investigators and System Administrators.', 'warning');
      navigateTo('dashboard');
      return;
    }
  }

  AppState.currentView = viewName;
  window.location.hash = '#' + viewName + (param ? '/' + param : '');

  // Update sidebar active class
  var navItems = document.querySelectorAll('.nav-item');
  navItems.forEach(function(item) {
    item.classList.remove('active');
    if (item.getAttribute('data-view') === viewName) {
      item.classList.add('active');
    }
  });

  // Render specific view
  var container = document.getElementById('content-container');
  if (!container) return;

  switch(viewName) {
    case 'dashboard':
      renderDashboardView();
      break;
    case 'protocols':
      renderProtocolsView();
      break;
    case 'my-protocols':
      renderMyProtocolsView();
      break;
    case 'protocol-detail':
      renderProtocolDetailView(param);
      break;
    case 'submission':
      renderSubmissionView();
      break;
    case 'screening':
      renderScreeningView();
      break;
    case 'assignments':
      renderAssignmentsView();
      break;
    case 'reviews':
      renderReviewsView();
      break;
    case 'my-reviews':
      renderMyReviewsView();
      break;
    case 'expedited':
      renderExpeditedView();
      break;
    case 'meetings':
      renderMeetingsView();
      break;
    case 'lifecycle':
      renderLifecycleView();
      break;
    case 'monitoring':
      renderMonitoringView();
      break;
    case 'data-collection':
      renderDataCollectionView(param);
      break;
    case 'progress-report':
      renderProgressReportForm(param);
      break;
    case 'closeout':
      renderCloseoutForm(param);
      break;
    case 'committee':
      renderCommitteeView();
      break;
    case 'investigators':
      renderInvestigatorsView();
      break;
    case 'reports':
      renderReportsView();
      break;
    case 'audit':
      renderAuditView();
      break;
    case 'settings':
      renderSettingsView();
      break;
    default:
      renderDashboardView();
  }

  // Close mobile sidebar on navigate
  closeMobileSidebar();
}

  'Investigator': { user_id: 'USR-PI-01', full_name: 'Dr. Dereje Haile', email: 'pi.dereje@aau.edu.et', role: 'Investigator' },

/**
 * Switch Auth Tab (Login vs Register)
 */
function switchAuthTab(tab) {
  var loginBtn = document.getElementById('tab-login-btn');
  var regBtn = document.getElementById('tab-register-btn');
  var paneLogin = document.getElementById('pane-login');
  var paneRegister = document.getElementById('pane-register');
  var loginErr = document.getElementById('login-error');
  var regErr = document.getElementById('reg-error');
  var regSucc = document.getElementById('reg-success');
  if (loginErr) loginErr.style.display = 'none';
  if (regErr) regErr.style.display = 'none';
  if (regSucc) regSucc.style.display = 'none';

  if (tab === 'register') {
    if (loginBtn) loginBtn.classList.remove('active');
    if (regBtn) regBtn.classList.add('active');
    if (paneLogin) paneLogin.classList.remove('active');
    if (paneRegister) paneRegister.classList.add('active');
  } else {
    if (regBtn) regBtn.classList.remove('active');
    if (loginBtn) loginBtn.classList.add('active');
    if (paneRegister) paneRegister.classList.remove('active');
    if (paneLogin) paneLogin.classList.add('active');
  }
}

/**
 * Direct One-Click Demo Role Login
 */
function quickLoginAs(roleName) {

    return;
  }
  var target = USERS_BY_ROLE[roleName] || USERS_BY_ROLE['Chairperson'];

/**
 * Handle Standard Form Login
 */
function handleLogin(directEmail, directPassword) {
  var email = directEmail || (document.getElementById('login-email') ? document.getElementById('login-email').value.trim() : '');
  var password = directPassword || (document.getElementById('login-password') ? document.getElementById('login-password').value : '');
  var errBox = document.getElementById('login-error');

  if (!email) {
    if (errBox) {
      errBox.querySelector('span').textContent = 'Please enter your registered email address.';
      errBox.style.display = 'block';
    }
    return;
  }
  if (!password) {
    if (errBox) {
      errBox.querySelector('span').textContent = 'Please enter your account password.';
      errBox.style.display = 'block';
    }
    return;
  }
  if (errBox) errBox.style.display = 'none';

  callBackend('apiLoginUser', [email, password], function(res) {
    if (res && res.user && res.session_token) {
      try {
        saveSessionToken_(res.session_token);
      } catch (e) {
        if (errBox) {
          errBox.querySelector('span').textContent = e.message;
          errBox.style.display = 'block';
        }
        return;
      }
      completeSignIn(res.user);
    } else {
      if (errBox) {
        errBox.querySelector('span').textContent = (res && res.error) ? res.error : 'Invalid email or password.';
        errBox.style.display = 'block';
      }
    }
  }, function(err) {
    if (errBox) {
      errBox.querySelector('span').textContent = err || 'Authentication failed. Please verify credentials.';
      errBox.style.display = 'block';
    }
  });
}

/**
 * Complete Sign In and Transition to Main Portal
 */
function completeSignIn(user) {
  AppState.currentUser = user;

  var authScreen = document.getElementById('auth-screen');
  var appLayout = document.getElementById('app-layout');
  if (authScreen) authScreen.style.display = 'none';
  if (appLayout) appLayout.style.display = 'flex';

  var nameEl = document.getElementById('topbar-user-name');
  if (nameEl) nameEl.textContent = user.full_name;
  var roleEl = document.getElementById('topbar-user-role');
  if (roleEl) roleEl.textContent = user.role;
  var footerName = document.getElementById('sidebar-user-name');
  if (footerName) footerName.textContent = user.full_name;
  var footerRole = document.getElementById('sidebar-user-role');
  if (footerRole) footerRole.textContent = user.role;
  var avatarEl = document.getElementById('sidebar-user-avatar');
  if (avatarEl) {
    var parts = user.full_name.replace('[DEMO DATA] ', '').split(' ');
    var initials = (parts[0] ? parts[0][0] : 'U') + (parts.length > 1 ? parts[parts.length-1][0] : 'S');
    avatarEl.textContent = initials.toUpperCase();
  }

  var roleSelect = document.querySelector('.role-select');
  if (roleSelect) {
    roleSelect.value = user.role;
  }

  if (typeof applyRoleBasedNav === 'function') {
    applyRoleBasedNav(user.role);
  }

  showToast('Authenticated as ' + user.full_name + ' (' + user.role + ')', 'success');
  navigateTo('dashboard');
}

/**
 * Handle Safe Sign Out
 */
function handleLogout() {
  callBackend('apiLogoutUser', [], function() {
    clearSessionToken_();
    AppState.currentUser = null;
    var authScreen = document.getElementById('auth-screen');
    var appLayout = document.getElementById('app-layout');
    if (authScreen) authScreen.style.display = 'block';
    if (appLayout) appLayout.style.display = 'none';
    switchAuthTab('login');
    showToast('Signed out successfully.', 'info');
  });
}

/**
 * Handle Investigator Registration
 */
function handleRegister() {
  var name = document.getElementById('reg-name') ? document.getElementById('reg-name').value.trim() : '';
  var email = document.getElementById('reg-email') ? document.getElementById('reg-email').value.trim() : '';
  var phone = document.getElementById('reg-phone') ? document.getElementById('reg-phone').value.trim() : '';
  var institution = document.getElementById('reg-institution') ? document.getElementById('reg-institution').value.trim() : '';
  var department = document.getElementById('reg-department') ? document.getElementById('reg-department').value.trim() : '';
  var pass1 = document.getElementById('reg-password') ? document.getElementById('reg-password').value : '';
  var pass2 = document.getElementById('reg-password2') ? document.getElementById('reg-password2').value : '';

  var errBox = document.getElementById('reg-error');
  var succBox = document.getElementById('reg-success');
  if (errBox) errBox.style.display = 'none';
  if (succBox) succBox.style.display = 'none';

  if (!name) {
    showRegError_('Please enter your full name with title.');
    return;
  }
  if (!email || email.indexOf('@') === -1) {
    showRegError_('Please enter a valid official email address.');
    return;
  }
  if (!institution) {
    showRegError_('Please specify your institution or university affiliation.');
    return;
  }
  if (!pass1 || pass1.length < 12) {
    showRegError_('Password must contain at least 12 characters.');
    return;
  }
  if (pass1 !== pass2) {
    showRegError_('Passwords do not match. Please re-enter.');
    return;
  }

  var payload = {
    full_name: name,
    email: email,
    telephone: phone,
    institution_name: institution,
    department: department,
    password: pass1
  };

  callBackend('apiRegisterInvestigator', [payload], function(res) {
    callBackend('apiLoginUser', [email, pass1], function(auth) {
      if (!auth || !auth.user || !auth.session_token) {
        showRegError_('Account created, but sign-in failed. Please sign in with your new credentials.');
        switchAuthTab('login');
        return;
      }
      try {
        saveSessionToken_(auth.session_token);
      } catch (e) {
        showRegError_(e.message);
        return;
      }
      if (succBox) {
        succBox.querySelector('span').textContent = 'Account created successfully! Signing you in as Investigator...';
        succBox.style.display = 'block';
      }
      completeSignIn(auth.user);
      showToast('Welcome, ' + name + '! You can now submit your research protocols.', 'success');
    }, function(err) {
      showRegError_(err || 'Account created, but sign-in failed. Please sign in with your new credentials.');
      switchAuthTab('login');
    });
  }, function(err) {
    showRegError_(err || 'Registration failed. An account with this email may already exist.');
  });
}

function showRegError_(msg) {
  var errBox = document.getElementById('reg-error');
  if (errBox) {
    errBox.querySelector('span').textContent = msg;
    errBox.style.display = 'block';
  }
}

function closeGoogleModal() {
  var modal = document.getElementById('google-auth-modal');
  if (modal) modal.remove();
}

function toggleCustomGoogleBox() {
  var el = document.getElementById('custom-google-box');
  if (el) el.style.display = (el.style.display === 'none' || !el.style.display) ? 'block' : 'none';
}

function selectGoogleAccount(email, name, inst, mode) {
  closeGoogleModal();
  showLoader(true);

  var payload = {
    email: email,
    full_name: name,
    institution_name: inst
  };

  callBackend('apiGoogleAuth', [payload], function(res) {
    showLoader(false);
    var user = (res && res.data) ? res.data : res;
    if (user && user.user_id) {
      completeSignIn(user);
      var isReg = mode === 'register';
      showToast((isReg ? 'Account registered! Welcome, ' : 'Signed in as ') + user.full_name + ' (Investigator)', 'success');
    } else {
      showToast('Google authentication failed. Please try again.', 'danger');
    }
  }, function(err) {
    showLoader(false);
    showToast(err || 'Google registration failed.', 'danger');
  });
}

function submitCustomGoogleAccount(mode) {
  var name = document.getElementById('custom-google-name') ? document.getElementById('custom-google-name').value.trim() : '';
  var email = document.getElementById('custom-google-email') ? document.getElementById('custom-google-email').value.trim() : '';
  var inst = document.getElementById('custom-google-inst') ? document.getElementById('custom-google-inst').value.trim() : '';

  if (!email || email.indexOf('@') === -1) {
    showToast('Please enter a valid Google email address.', 'warning');
    return;
  }
  if (!name) {
    name = email.split('@')[0].replace(/[._]/g, ' ');
    name = name.replace(/\b\w/g, function(l){ return l.toUpperCase(); });
    name = 'Dr. ' + name;
  }
  if (!inst) {
    inst = email.indexOf('@aau') !== -1 ? 'Addis Ababa University' : 'Addis Ababa City Administration Health Bureau';
  }

  selectGoogleAccount(email, name, inst, mode);
}


/**
 * Mobile Sidebar Drawer Controls
 */
function closeMobileSidebar() {
  var sidebar = document.getElementById('sidebar');
  var backdrop = document.getElementById('sidebar-backdrop');
  if (sidebar) sidebar.classList.remove('open');
  if (backdrop) backdrop.classList.remove('active');
}

function openMobileSidebar() {
  var sidebar = document.getElementById('sidebar');
  var backdrop = document.getElementById('sidebar-backdrop');
  if (sidebar) sidebar.classList.add('open');
  if (backdrop) backdrop.classList.add('active');
}

function toggleMobileSidebar() {
  var sidebar = document.getElementById('sidebar');
  if (sidebar && sidebar.classList.contains('open')) {
    closeMobileSidebar();
  } else {
    openMobileSidebar();
  }
}

/**
 * Application Lifecycle & Global Event Delegation on DOM Ready
 */
document.addEventListener('DOMContentLoaded', function() {
  // 1. Mobile Menu Toggle Button
  var menuBtn = document.getElementById('mobile-toggle');
  if (menuBtn) {
    menuBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      toggleMobileSidebar();
    });
  }

  // 2. Mobile Backdrop Click
  var backdrop = document.getElementById('sidebar-backdrop');
  if (backdrop) {
    backdrop.addEventListener('click', closeMobileSidebar);
  }

  // 3. Robust Event Delegation for all [data-view] elements across entire app
  document.addEventListener('click', function(e) {
    var navItem = e.target.closest('[data-view]');
    if (navItem) {
      e.preventDefault();
      var view = navItem.getAttribute('data-view');
      navigateTo(view);
      closeMobileSidebar();
    }
  });

  // 4. Hash Router Change Listener
  window.addEventListener('hashchange', function() {
    var hash = window.location.hash.substring(1);
    if (hash) {
      var parts = hash.split('/');
      navigateTo(parts[0], parts[1]);
    }
  });

  // 5. Global Search Keydown
  var globalSearch = document.querySelector('.global-search input');
  if (globalSearch) {
    globalSearch.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        navigateTo('protocols');
        var input = document.getElementById('filter-search');
        if (input) {
          input.value = this.value;
          if (typeof applyProtocolFilters === 'function') applyProtocolFilters();
        }
      }
    });
  }

  // 6. Check Active User Session or Load Landing Page
  callBackend('apiGetSessionUser', [], function(u) {
    if (u && u.user_id) {
      completeSignIn(u);
      var hash = window.location.hash.substring(1);
      if (hash) {
        var parts = hash.split('/');
        navigateTo(parts[0], parts[1]);
      } else {
        navigateTo('dashboard');
      }
    } else {
      // In local preview/test environment, show landing auth screen
      var authScreen = document.getElementById('auth-screen');
      var appLayout = document.getElementById('app-layout');
      if (authScreen) authScreen.style.display = 'block';
      if (appLayout) appLayout.style.display = 'none';
    }
  });
});
