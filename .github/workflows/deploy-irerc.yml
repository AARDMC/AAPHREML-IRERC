name: Deploy AAPHREML-IRERC

on:
  workflow_dispatch:
  push:
    branches:
      - clean-production-source
    paths:
      - 'Code.gs'
      - 'Index.html'
      - 'client/**'
      - 'server/**'
      - 'styles/**'
      - 'scripts/**'
      - 'Logo File.png'
      - 'appsscript.json'
      - '.claspignore'
      - '.clasp.json'
      - '.github/workflows/deploy-irerc.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aaphreml-irerc-production
  cancel-in-progress: false

jobs:
  deploy-backend:
    # Apps Script deployment is optional until the owner configures the clasp secret
    # and both project/deployment IDs in the irerc-production environment.
    if: ${{ vars.IRERC_SCRIPT_ID != '' && vars.IRERC_DEPLOYMENT_ID != '' }}
    environment: irerc-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Deploy the single-file Apps Script backend
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ vars.IRERC_SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ vars.IRERC_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON" || { echo "::error::Set CLASPRC_JSON in the irerc-production environment."; exit 1; }
          test -n "$SCRIPT_ID" || { echo "::error::Set IRERC_SCRIPT_ID in the irerc-production environment."; exit 1; }
          test -n "$DEPLOYMENT_ID" || { echo "::error::Set IRERC_DEPLOYMENT_ID in the irerc-production environment."; exit 1; }

          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          node scripts/build-gas.js
          node -e 'const fs=require("node:fs"); fs.writeFileSync(".gas-build/.clasp.json", JSON.stringify({scriptId:process.env.SCRIPT_ID,rootDir:"."},null,2)+"\n");'
          (cd .gas-build && clasp show-file-status && clasp push --force && clasp update-deployment "$DEPLOYMENT_ID" --description "GitHub commit $GITHUB_SHA")

  build-pages:
    environment: irerc-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build GitHub Pages frontend
        env:
          IRERC_DEPLOYMENT_ID: ${{ vars.IRERC_DEPLOYMENT_ID || 'AKfycby6lSqrVWnhoguSXmDoCled1JYAk1oSFggJ3X9Mc-gJUOFb_FmhxiKcjjqWXU19AGHG' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/build-pages.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site

  deploy-pages:
    needs: build-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
