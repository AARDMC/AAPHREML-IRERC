name: Portal CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild standalone preview
        shell: pwsh
        run: ./build_preview.ps1

      - name: Verify generated preview is committed
        run: git diff --exit-code -- preview.html

      - name: Validate Apps Script and preview
        run: node .github/scripts/validate-portal.cjs

      - name: Check patch whitespace
        run: git diff --check "origin/${{ github.base_ref || 'main' }}...HEAD"
